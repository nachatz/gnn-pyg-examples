[project]
name = "gnn-pyg-examples"
version = "1.0.0"
description = "Short, runnable PyTorch Geometric examples that explain the core ideas of graph neural networks."
authors = [{ name = "Nikolas Achatz" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jaxtyping==0.3.11",
    "pydantic-settings==2.15.0",
    "torch==2.14.1",
    "torch-geometric==2.8.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "polyfactory==3.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.16.0",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true